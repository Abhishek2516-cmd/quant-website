<!DOCTYPE html>
<html>
<head>
  <title>Quant Trading</title>
</head>
<body style="text-align:center; font-family:Arial;">

<h1>🔥 Quant Trading Dashboard</h1>
<h2 id="signal">Loading...</h2>

<script>
async function getSignal() {
  let res = await fetch("https://quant-backend-jhum.onrender.com/signals");
  let data = await res.json();

  document.getElementById("signal").innerText = data.action;
}

// Run immediately first time
getSignal();

// Then repeat every 3 sec
setInterval(getSignal, 3000);
</script>

</body>
</html>
